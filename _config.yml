# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.author }}, {{ site.github_url }}, etc.

title: "beblugger's blog"
email: n0reply@sjtu.edu.cn
description: >- # Describes your new site in meta tags and in your feed.xml.
  another blog
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://beblugger.github.io" # the base hostname & protocol for your site
github_username: beblugger

# Build settings
markdown: kramdown
kramdown:
  math_engine: katex
# theme: minima
# remote_theme: jekyll-theme-hacker
remote_theme: pages-themes/hacker@v0.2.0
plugins:
  - jekyll-feed
  - jekyll-remote-theme # add this line to the plugins list if you already have one

# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically excluded from
# the internal list of files to process:
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/